<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <!-- TODO: Replace placeholder robot visual with the official ELXIE robot artwork. -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="160" cy="210" rx="90" ry="12" fill="#000000" fill-opacity="0.4"/>

  <!-- Left / Right Wheels -->
  <rect x="48" y="145" width="28" height="60" rx="10" fill="url(#wheelGrad)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="244" y="145" width="28" height="60" rx="10" fill="url(#wheelGrad)" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Robot Body Chassis (Car shape) -->
  <rect x="70" y="70" width="180" height="125" rx="28" fill="url(#bodyGrad)" stroke="#38bdf8" stroke-width="3"/>
  <rect x="82" y="80" width="156" height="75" rx="18" fill="#040d1a" stroke="#0ea5e9" stroke-width="2"/>

  <!-- Front OLED Digital Display Face -->
  <rect x="92" y="88" width="136" height="58" rx="12" fill="#02131e" stroke="#00f5d4" stroke-width="2" filter="url(#glowTeal)"/>
  
  <!-- Eyes -->
  <circle cx="125" cy="117" r="12" fill="#00f5d4" filter="url(#glowTeal)"/>
  <circle cx="195" cy="117" r="12" fill="#00f5d4" filter="url(#glowTeal)"/>
  <!-- Catchlights -->
  <circle cx="128" cy="114" r="3" fill="#ffffff"/>
  <circle cx="198" cy="114" r="3" fill="#ffffff"/>

  <!-- Sensor Array & Bumper -->
  <circle cx="160" cy="170" r="5" fill="#fee440"/>
  <circle cx="130" cy="170" r="4" fill="#38bdf8"/>
  <circle cx="190" cy="170" r="4" fill="#38bdf8"/>

  <!-- Top Antenna / Status Beacon -->
  <path d="M160 70V40" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="160" cy="36" r="7" fill="#fee440" stroke="#ffffff" stroke-width="2"/>
</svg>
